"Técnicas da Kenshydokan Básicas":
  descrição: "Conjunto de técnicas básicas ensinadas na escola Kenshydokan da branca até a amarela."
  "Atemi Waza":
    descrição: "Técnicas de ataque."
    categorias:
      "Tsuki Waza":
        descrição: "Técnicas de ataque com o punho."
        tecnicas:
          - "Seiken jodan tsuki: Soco reto ao rosto."
          - "Seiken gedan tsuki: Soco reto ao abdômen."
          - "Seiken chudan tsuki: Soco reto ao peito."
          - "Seiken gyaku tsuki: Soco reverso ao peito."
          - "Seiken oi tsuki: Soco avançado ao peito."
          - "Seiken kizami tsuki: Soco rápido e curto ao peito."
          - "Seiken Tate tsuki: Soco vertical ao peito."      
      "Hiji Waza":
        descrição: "Técnicas de ataque com o cotovelo."
        tecnicas:
          - "Hiji jodan ate: Cotovelada ascendente ao rosto."
      "Uke Waza":
        descrição: "Técnicas de bloqueio."
        tecnicas:
          - "Seiken Jodan Uke: Bloqueio alto."
          - "Seiken Chudan Uke: Bloqueio médio."
          - "Seiken Gedan Barai: Bloqueio baixo."
          - "Seiken Soto Uke: Bloqueio externo."
          - "Seiken Uchi Uke: Bloqueio interno."
          - "Shuto Uke: Bloqueio com a mão em forma de faca."
      "Keri Waza":
        descrição: "Técnicas de chute."
        tecnicas:
          - "Mae Geri: Chute frontal."
          - "Mawashi Geri: Chute circular."
          - "Soto Mawashi Geri: Chute circular externo."
  "Nage Waza":
    descrição: "Técnicas de projeção."
    categorias:
      "Koshi Waza":
        descrição: "Técnicas de projeção com o quadril."
        tecnicas:
          - "Koshi Guruma: Projeção de quadril em roda."
      "Ashi Waza":
        descrição: "Técnicas de projeção com as pernas."
        tecnicas:
          - "O Soto Gari: Corte externo com a perna traseira."
      "Te Waza":
        descrição: "Técnicas de projeção com as mãos."
        tecnicas:
          - "Ippon Seoi Nage: Projeção de ombro com uma mão."
  "Ne Waza":
    descrição: "Técnicas de solo."
    categorias:
      "Ossae Waza":
        descrição: "Técnicas de imobilização."
        tecnicas:
          - "Kesa Gatame: Imobilização em ângulo."
      "Shime Waza":
        descrição: "Técnicas de estrangulamento."
        tecnicas:
          - "Kata Juji Jime: Estrangulamento cruzado com uma mão."
      "Kansetsu Waza":
        descrição: "Técnicas de chave articular."
        tecnicas:
          - "Ude Hishigi Juji Gatame: Chave de braço em cruz."
